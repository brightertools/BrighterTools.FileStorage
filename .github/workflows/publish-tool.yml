name: publish-tool
on:
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        type: boolean
        required: true
        default: false
jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test release
        run: dotnet test tests/BrighterTools.FileStorage.Tests -c Release -m:1 -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Pack only the new provider release
        run: dotnet pack src/BrighterTools.FileStorage.Disk/BrighterTools.FileStorage.Disk.csproj -c Release -o artifacts/nuget --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: brightertools.filestorage.disk
          path: artifacts/nuget/*
      - name: NuGet login
        if: ${{ inputs.publish_to_nuget }}
        uses: NuGet/login@v1
        id: login
        with:
          user: brightertools
      - name: Publish exact provider version
        if: ${{ inputs.publish_to_nuget }}
        run: dotnet nuget push artifacts/nuget/BrighterTools.FileStorage.Disk.*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
